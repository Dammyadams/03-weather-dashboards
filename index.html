<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive weather dashboard">
  <title>Atmos Weather</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="#" aria-label="Atmos weather home">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span>Atmos</span>
      </a>

      <form class="search-form" id="search-form" role="search">
        <label class="sr-only" for="city-input">Search for a city</label>
        <div class="search-control">
          <span aria-hidden="true">⌕</span>
          <input id="city-input" name="city" type="search" placeholder="Search city" autocomplete="off">
        </div>
        <button class="search-button" type="submit">Search</button>
      </form>
    </header>

    <div class="status-stack" aria-live="polite">
      <p class="status-message" id="loading-status" role="status" hidden></p>
      <p class="status-message status-error" id="error-status" role="alert" hidden></p>
    </div>

    <main class="dashboard">
      <div class="main-column">
        <section class="weather-hero glass-panel" aria-labelledby="weather-location">
          <div class="hero-heading">
            <div>
              <p class="eyebrow">Current weather</p>
              <h1 id="weather-location">Lisbon, Portugal</h1>
            </div>
            <button class="icon-button" id="favourite-button" type="button" aria-label="Add Lisbon to favourites" aria-pressed="false">
              <span aria-hidden="true">☆</span>
            </button>
          </div>
          <div class="hero-content">
            <div class="temperature-block">
              <span class="weather-icon" id="current-icon" aria-hidden="true">☀️</span>
              <p class="temperature" id="current-temperature">24°</p>
              <p class="condition" id="current-condition">Clear sky</p>
            </div>
            <dl class="weather-details">
              <div>
                <dt>Wind</dt>
                <dd id="wind-speed">14 km/h</dd>
              </div>
              <div>
                <dt>Local time</dt>
                <dd id="local-time">10:42</dd>
              </div>
            </dl>
          </div>
        </section>

        <section class="forecast-section" aria-labelledby="forecast-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Next 7 days</p>
              <h2 id="forecast-heading">Forecast</h2>
            </div>
          </div>
          <div class="forecast-grid" id="forecast-grid"></div>
        </section>
      </div>

      <aside class="favourites-panel glass-panel" aria-labelledby="favourites-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Saved places</p>
            <h2 id="favourites-heading">Favourites</h2>
          </div>
          <span class="favourites-count" id="favourites-count">3</span>
        </div>
        <ul class="favourites-list" id="favourites-list"></ul>
      </aside>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
